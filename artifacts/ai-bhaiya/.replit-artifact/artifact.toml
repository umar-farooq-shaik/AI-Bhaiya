kind = "web"
previewPath = "/"
title = "AI Bhaiya"
description = "A personalized AI learning platform that assesses what learners know, builds an adaptive roadmap, and guides them through practical lessons, exercises, progress, AI trends, and career skills."
version = "1.0.0"
id = "artifacts/ai-bhaiya"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20187

[services.development]
run = "pnpm --filter @workspace/ai-bhaiya run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/ai-bhaiya", "run", "build" ]
serve = "static"
publicDir = "artifacts/ai-bhaiya/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20187"
BASE_PATH = "/"
